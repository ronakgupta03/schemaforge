name = "schemaforge-worker"
account_id = "f573408e311d6c38780131fafd5c57eb"
main = "src/index.ts"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../ui/dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "SF_CONFIG_KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

[[containers]]
class_name = "TrueForgeContainer"
image = "./Dockerfile.trueforge"
image_build_context = "../"
max_instances = 1
instance_type = "standard-1"

[[containers]]
class_name = "PostgresMcpContainer"
image = "./Dockerfile.postgres-mcp"
image_build_context = "../"
max_instances = 1
instance_type = "lite"

[[containers]]
class_name = "GithubMcpContainer"
image = "./Dockerfile.github-mcp"
image_build_context = "../"
max_instances = 1
instance_type = "lite"

[[containers]]
class_name = "RegistryContainer"
image = "./Dockerfile.registry"
image_build_context = "../"
max_instances = 1
instance_type = "lite"

[[durable_objects.bindings]]
name = "TRUEFORGE_CONTAINER"
class_name = "TrueForgeContainer"

[[durable_objects.bindings]]
name = "POSTGRES_MCP_CONTAINER"
class_name = "PostgresMcpContainer"

[[durable_objects.bindings]]
name = "GITHUB_MCP_CONTAINER"
class_name = "GithubMcpContainer"

[[durable_objects.bindings]]
name = "REGISTRY_CONTAINER"
class_name = "RegistryContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrueForgeContainer", "PostgresMcpContainer", "GithubMcpContainer", "RegistryContainer"]

[vars]
STANDALONE = "false"
HOST = "0.0.0.0"
PORT = "8790"
# Secrets (POSTGRES_PASSWORD, REDIS_URL, PUBLIC_BASE_URL, DAYTONA_API_KEY,
# SF_MCP_CONFIG_TOKEN, CLOUDFLARE_AUTH_TOKEN, CLOUDFLARE_ACCOUNT_ID)
# are set via `wrangler secret put` — never in this file.

[triggers]
crons = ["*/5 * * * *"]